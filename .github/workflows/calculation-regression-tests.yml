name: Calculation Regression Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculation-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run approved calculation regression tests
        run: ./mvnw -B test -Dtest=DashboardCalculationServiceImplTest,DashboardCalculationServiceImplWeekBasedTest,DashboardKpiPopulationServiceImplTest,ProjectHistorySorterTest,ReportingMonthUtilTest,ProjectMapperTest,ProjectSyncValidatorTest,SheetEnhancementMapperTest,SheetEnhancementSyncTest
