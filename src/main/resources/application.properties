# =========================
# Server Configuration
# =========================
server.port=${PORT:8080}


# =========================
# Database Configuration
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# Hibernate / JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================
# Google Sheets
# =========================
google.credentials.path=credentials/google-service-account.json
google.sheet.id=${GOOGLE_SHEET_ID}
refresh.api.key = ${REFRESH_API_KEY}

# =========================
# Scheduler Configuration
# =========================
scheduler.enabled=${SCHEDULER_ENABLED:false}
scheduler.zone=${SCHEDULER_ZONE:Asia/Kolkata}

scheduler.recent.cron=${RECENT_SYNC_CRON:0 0 10,14,18 * * MON-SAT}
scheduler.historical.cron=${HISTORICAL_AUDIT_CRON:0 30 7 * * MON,WED,FRI}
